on: push
name: Main workflow
jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    container: python:3.14@sha256:1eb6b7d4b76454b1de8317863ac3213b678c337b27e604a4e3fb70bddbb2bad7

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Python version
        run: |
          python -V
      - run: pip install "poetry>=2,<3"
      - run: poetry install
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
  pytest:
    name: Test on ${{ matrix.container }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container:
          - python:3.14
          - python:3.13
          - python:3.12
          - python:3.11
          - python:3.10
          - python:3.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Python version
        run: |
          python -V
      - name: Install dependencies
        run: |
          pip install "poetry>=2,<3"
          poetry install
      - name: Run tests
        run: |
          poetry run pytest --cov=resubname --cov-report xml --cov-report term-missing
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{secrets.CODECOV_TOKEN}}
