on: push
name: Main workflow
jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    container: python:3.14

    steps:
      - uses: actions/checkout@v5
      - name: Check Python version
        run: |
          python -V
      - run: pip install "poetry>=2,<3"
      - run: poetry install
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
  pytest:
    name: Test on ${{ matrix.container }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container:
          - python:3.14
          - python:3.13
          - python:3.12
          - python:3.11
          - python:3.10
          - python:3.9
    steps:
      - uses: actions/checkout@v5
      - name: Check Python version
        run: |
          python -V
      - name: Install dependencies
        run: |
          pip install "poetry>=2,<3"
          poetry install
      - name: Run tests
        run: |
          poetry run pytest --cov=resubname --cov-report xml --cov-report term-missing
      - uses: codecov/codecov-action@v6.0.2
        with:
          token: ${{secrets.CODECOV_TOKEN}}
